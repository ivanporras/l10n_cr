<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Fondo -->
  <rect width="800" height="500" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10" ry="10" />
  
  <!-- Título -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#0072b2">Módulos Incluidos</text>
  
  <!-- Módulo 1: cr_electronic_invoice -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="200" height="80" fill="#0072b2" rx="10" ry="10" />
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Facturación Electrónica</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">cr_electronic_invoice</text>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ffffff">Módulo principal</text>
  </g>
  
  <!-- Módulo 2: cabys -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="200" height="80" fill="#28a745" rx="10" ry="10" />
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Catálogo CABYS</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">cabys</text>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ffffff">Bienes y servicios</text>
  </g>
  
  <!-- Módulo 3: cr_import_vendor_bills -->
  <g transform="translate(550, 80)">
    <rect x="0" y="0" width="200" height="80" fill="#ffc107" rx="10" ry="10" />
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Importar Facturas</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">cr_import_vendor_bills</text>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#333">Facturas proveedores</text>
  </g>
  
  <!-- Módulo 4: account_financial_report -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="200" height="80" fill="#17a2b8" rx="10" ry="10" />
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Reportes Financieros</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">account_financial_report</text>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ffffff">Informes contables</text>
  </g>
  
  <!-- Módulo 5: date_range -->
  <g transform="translate(300, 200)">
    <rect x="0" y="0" width="200" height="80" fill="#6f42c1" rx="10" ry="10" />
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Rangos de Fechas</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">date_range</text>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ffffff">Períodos contables</text>
  </g>
  
  <!-- Módulo 6: report_xlsx -->
  <g transform="translate(550, 200)">
    <rect x="0" y="0" width="200" height="80" fill="#20c997" rx="10" ry="10" />
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Reportes Excel</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">report_xlsx</text>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ffffff">Exportar a Excel</text>
  </g>
  
  <!-- Módulo 7: l10n_cr_hacienda_info_query -->
  <g transform="translate(175, 320)">
    <rect x="0" y="0" width="200" height="80" fill="#fd7e14" rx="10" ry="10" />
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Consultas Hacienda</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">l10n_cr_hacienda_info_query</text>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ffffff">Validaciones oficiales</text>
  </g>
  
  <!-- Módulo 8: Instalador -->
  <g transform="translate(425, 320)">
    <rect x="0" y="0" width="200" height="80" fill="#dc3545" rx="10" ry="10" />
    <text x="100" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Instalador FE CR</text>
    <text x="100" y="45" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#ffffff">cr_electronic_invoice_install</text>
    <text x="100" y="60" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#ffffff">Este módulo</text>
  </g>
  
  <!-- Flechas de conexión -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
  
  <!-- Líneas conectoras -->
  <line x1="525" y1="360" x2="375" y2="360" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="375" y1="360" x2="275" y2="360" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">El instalador configura automáticamente todos los módulos</text>
</svg>