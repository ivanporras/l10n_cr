<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Fondo -->
  <rect width="600" height="400" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="10" ry="10" />
  
  <!-- Título -->
  <text x="300" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#0072b2">Proceso de Instalación</text>
  
  <!-- Paso 1 -->
  <g transform="translate(50, 80)">
    <circle cx="30" cy="30" r="25" fill="#0072b2" />
    <text x="30" y="37" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Instalar Módulo</text>
    <text x="80" y="40" font-family="Arial, sans-serif" font-size="12" fill="#666">Busque e instale desde Apps</text>
    
    <!-- Icono de descarga -->
    <g transform="translate(450, 15)">
      <rect x="0" y="0" width="40" height="30" fill="#e9ecef" stroke="#adb5bd" stroke-width="1" rx="3" ry="3" />
      <path d="M10,15 L20,25 L30,15 M20,10 L20,25" fill="none" stroke="#0072b2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
  
  <!-- Flecha 1 -->
  <path d="M300,120 L300,140" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Paso 2 -->
  <g transform="translate(50, 150)">
    <circle cx="30" cy="30" r="25" fill="#28a745" />
    <text x="30" y="37" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Instalación Automática</text>
    <text x="80" y="40" font-family="Arial, sans-serif" font-size="12" fill="#666">Todos los módulos se instalan automáticamente</text>
    
    <!-- Icono de engranajes -->
    <g transform="translate(450, 15)">
      <circle cx="15" cy="15" r="12" fill="none" stroke="#28a745" stroke-width="2" />
      <circle cx="25" cy="15" r="8" fill="none" stroke="#28a745" stroke-width="2" />
      <path d="M12,15 L18,15 M27,15 L33,15" stroke="#28a745" stroke-width="2" />
    </g>
  </g>
  
  <!-- Flecha 2 -->
  <path d="M300,190 L300,210" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Paso 3 -->
  <g transform="translate(50, 220)">
    <circle cx="30" cy="30" r="25" fill="#ffc107" />
    <text x="30" y="37" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">3</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Configurar Compañía</text>
    <text x="80" y="40" font-family="Arial, sans-serif" font-size="12" fill="#666">Configure datos de su empresa</text>
    
    <!-- Icono de empresa -->
    <g transform="translate(450, 15)">
      <rect x="5" y="20" width="30" height="15" fill="#e9ecef" stroke="#ffc107" stroke-width="2" />
      <polygon points="10,20 20,10 30,20" fill="#ffc107" />
      <rect x="15" y="25" width="4" height="6" fill="#ffc107" />
      <rect x="22" y="25" width="4" height="6" fill="#ffc107" />
    </g>
  </g>
  
  <!-- Flecha 3 -->
  <path d="M300,260 L300,280" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Paso 4 -->
  <g transform="translate(50, 290)">
    <circle cx="30" cy="30" r="25" fill="#dc3545" />
    <text x="30" y="37" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Configurar Certificado</text>
    <text x="80" y="40" font-family="Arial, sans-serif" font-size="12" fill="#666">Suba su certificado digital</text>
    
    <!-- Icono de certificado -->
    <g transform="translate(450, 15)">
      <rect x="10" y="10" width="20" height="25" fill="#e9ecef" stroke="#dc3545" stroke-width="2" rx="2" ry="2" />
      <circle cx="20" cy="20" r="4" fill="none" stroke="#dc3545" stroke-width="1" />
      <path d="M17,20 L19,22 L23,18" fill="none" stroke="#dc3545" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
  
  <!-- Paso 5 - Resultado final -->
  <g transform="translate(200, 350)">
    <rect x="0" y="0" width="200" height="40" fill="#28a745" rx="20" ry="20" />
    <text x="100" y="15" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">¡Listo para Facturar!</text>
    <text x="100" y="30" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#ffffff">Sistema completamente configurado</text>
  </g>
  
  <!-- Definiciones para flechas -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
    </marker>
  </defs>
</svg>